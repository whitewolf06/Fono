name: STT public corpus quality

on:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/crates/fono-audio/**"
      - "src-tauri/crates/fono-stt-protocol/**"
      - "src-tauri/crates/fono-stt-worker/**"
      - "src-tauri/src/stt/**"
      - "src-tauri/tests/fixtures/stt-quality/**"
      - "scripts/stt-quality*"
      - "scripts/prepare-stt-quality-corpus.py"
      - ".github/workflows/stt-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      CARGO_TARGET_DIR: ${{ github.workspace }}\src-tauri\target-codex-review
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Verify public corpus hashes and quality gate
        shell: pwsh
        run: node --test scripts/stt-quality.test.mjs
      - name: Build offline CPU tools without private frontend or GPU
        working-directory: src-tauri
        shell: pwsh
        run: cargo build --locked --release --no-default-features -p fono-audio --example resample-wav -p fono-stt-worker --bin fono-stt-quality
      - name: Compare legacy and current resampling with pinned public model
        shell: pwsh
        run: node scripts/stt-quality.mjs --target src-tauri/target-codex-review/release --download-model
      - name: Save numerical quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stt-quality-cpu
          path: build/stt-quality/report.json
          if-no-files-found: warn
          retention-days: 30
