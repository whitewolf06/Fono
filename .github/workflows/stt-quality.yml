name: STT public corpus quality

on:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/crates/fono-audio/**"
      - "src-tauri/crates/fono-stt-protocol/**"
      - "src-tauri/crates/fono-stt-worker/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/rust-toolchain.toml"
      - "src-tauri/.cargo/**"
      - "src-tauri/src/stt/**"
      - "src-tauri/src/types/whisper_artifacts.rs"
      - "src-tauri/resources/whisper-quantized-models.json"
      - "src-tauri/src/application/speech_gate.rs"
      - "src-tauri/src/application/dictation/capture.rs"
      - "src-tauri/src/vad/**"
      - "src-tauri/tests/fixtures/stt-quality/**"
      - "scripts/stt-quality*"
      - "scripts/stt-quantized-quality*"
      - "scripts/stage4-quality*"
      - "scripts/stage5-quality*"
      - "scripts/bootstrap-ci-resources.ps1"
      - "scripts/native-test-runtime.mjs"
      - "scripts/prepare-stt-quality-corpus.py"
      - ".github/workflows/stt-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.reconstruction }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        reconstruction: [legacy_linear, cardinal_sinc]
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      CARGO_TARGET_DIR: ${{ github.workspace }}\src-tauri\target-codex-review
      STT_QUALITY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.reconstruction }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Verify public corpus hashes and quality gate
        shell: pwsh
        run: node --test scripts/stt-quality.test.mjs scripts/stage5-quality.test.mjs scripts/stt-quantized-quality.test.mjs
      - name: Prepare verified CPU speech VAD runtime
        shell: pwsh
        run: ./scripts/bootstrap-ci-resources.ps1
      - name: Build offline CPU tools without private frontend or GPU
        working-directory: src-tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../build/stt-quality | Out-Null
          cargo build --locked --release --no-default-features --features fono-audio/speech-vad -p fono-audio --example resample-wav --example trim-vad-wav -p fono-stt-worker --bin fono-stt-quality --message-format=json > ../build/stt-quality/tools.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage verified VAD DLLs beside the emitted CPU tools
        shell: pwsh
        run: node scripts/native-test-runtime.mjs build/stt-quality/tools.jsonl $env:SHERPA_ONNX_LIB_DIR $env:CARGO_TARGET_DIR
      - name: Compare legacy and current resampling with pinned public model
        shell: pwsh
        run: |
          $reconstructionArguments = @()
          if ('${{ matrix.reconstruction }}' -eq 'cardinal_sinc') {
            $reconstructionArguments += '--bandlimited-reconstruction'
          }
          node scripts/stt-quality.mjs --target src-tauri/target-codex-review/release --download-model --require-no-wer-regression --report build/stt-quality/report.json @reconstructionArguments
          exit $LASTEXITCODE
      - name: Compare neural boundaries and explicit decoding policies
        if: ${{ !cancelled() }}
        shell: pwsh
        run: node scripts/stage4-quality.mjs --runner src-tauri/target-codex-review/release/fono-stt-quality.exe --trimmer src-tauri/target-codex-review/release/examples/trim-vad-wav.exe --report build/stt-quality/stage4-report.json
      - name: Consolidate same-run quality, cold and warm latency evidence
        if: ${{ !cancelled() }}
        shell: pwsh
        run: node scripts/stage5-quality.mjs --report build/stt-quality/stage5-report.json
      - name: Save numerical quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stt-quality-cpu-${{ matrix.reconstruction }}
          path: |
            build/stt-quality/report.json
            build/stt-quality/stage4-report.json
            build/stt-quality/stage5-report.json
          if-no-files-found: warn
          retention-days: 30

  quality-result:
    name: quality
    needs: [quality]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both reconstruction methods to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success
