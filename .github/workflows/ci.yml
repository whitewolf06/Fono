name: Fono checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fono-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core, shared types and protocol (no private packages)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - name: Format, core tests and clippy
        working-directory: .
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p fono-core -p fono-types -p fono-stt-protocol --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked -p fono-core -p fono-types -p fono-stt-protocol --all-targets -- -D warnings
          exit $LASTEXITCODE

  linux:
    name: Linux native workspace (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FONO_BUILD_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake curl pkg-config python3 \
            libasound2-dev libayatana-appindicator3-dev libdbus-1-dev \
            libgtk-3-dev libopus-dev librsvg2-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"
      - name: Verify Linux bootstrap contracts
        run: python3 scripts/bootstrap-ci-linux.test.py
      - name: Bootstrap verified Linux native runtime
        timeout-minutes: 10
        run: bash scripts/bootstrap-ci-linux.sh
      - name: Verify shared crate boundaries
        run: |
          node --test scripts/check-crate-boundaries.test.mjs
          node scripts/check-crate-boundaries.mjs
      - name: Check Linux workspace
        working-directory: .
        run: cargo check --locked --workspace
      - name: Build Fono Server
        run: cargo build --locked -p fono-server
      - name: Test Fono Server CLI
        run: cargo test --locked -p fono-server --all-targets
      - name: Cache pinned public CPU fixtures
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            build/remote-client-cpu/ggml-tiny.bin
            build/remote-client-cpu/jfk.wav
          key: remote-client-cpu-${{ runner.os }}-${{ hashFiles('apps/fono-server/tests/fixtures/remote-client-cpu.json') }}
      - name: Verify public CPU client-server fixtures
        run: |
          node --test scripts/remote-client-cpu-resources.test.mjs
          node scripts/remote-client-cpu-resources.mjs --download --out-dir build/remote-client-cpu --github-env "$GITHUB_ENV"
      - name: Recognize public audio through the real CPU server
        timeout-minutes: 5
        env:
          FONO_TST02_REPORT: ${{ github.workspace }}/build/remote-client-cpu/linux.json
        run: cargo test --locked -p fono-server --lib runtime::client_cpu::real_cpu_remote_client_roundtrip -- --ignored --exact --nocapture
      - name: Test shared Rust crates
        working-directory: .
        run: |
          cargo test --locked -p fono-core -p fono-types -p fono-stt-protocol -p fono-stt -p fono-audio -p fono-wake --lib
          cargo test --locked -p fono-types --test wire_contract

  setup:
    name: Online installer (Windows)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - name: Build and verify standalone online installer
        shell: pwsh
        run: ./scripts/build-online-installer.ps1

  frontend:
    name: Frontend V3 and release scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"
          registry-url: https://registry.npmjs.org
      - name: Verify Linux optional dependency lock before installation
        run: node scripts/ci-frontend-dependencies.mjs --lock
      - name: Install locked dependencies
        run: |
          npm ci
      - name: Verify installed native frontend dependencies
        run: |
          node scripts/ci-frontend-dependencies.mjs --installed
          node --test scripts/ci-frontend-dependencies.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned CPU dependencies for wake numerical contracts
        run: |
          python -m pip install --only-binary=:all: -r tools/wake-training/requirements-ci.txt
          python -m pip install --only-binary=:all: torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Wake benchmark contracts without models or microphone
        run: python -m unittest discover -s tools/wake-bench -p 'test_*.py' -v
      - name: Wake training contracts without models or microphone
        run: python -m unittest discover -s tools/wake-training -p 'test_*.py' -v
      - name: Typecheck, lint, tests and formatting
        run: |
          npm run typecheck:v3
          npm run lint
          npm run test:v3
          npm run check:server-panel
          npm run test:release
          npm run test:quality:stage5
          node --test scripts/long-dictation-quality.test.mjs
          npm run test:soak:contracts
          npm run test:cpu
          node --test scripts/check-doc-links.test.mjs
          npm run docs:check
          npm run format:check
          npx prettier --check '.github/workflows/*.yml' 'scripts/*release*.mjs' scripts/check-crate-boundaries.mjs scripts/check-crate-boundaries.test.mjs scripts/update-manifest.mjs scripts/ci-native-dependencies.json src-tauri/update-channel.json tests/ui/diagnosticReport.test.mjs tests/ui/personalDictionary.test.mjs tests/ui/historyMetadata.test.mjs tests/ui/updates.test.mjs docs/delivery.md docs/user-guide.md
          npm run version:check
          npm run build

  native:
    name: Windows native workspace (CPU)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      FONO_BUILD_REVISION: ${{ github.sha }}
      # Inert frontend fixture also supports explicit custom-protocol checks;
      # it needs no npm packages and does not exercise the real UI.
      # JSON Merge Patch removes only GPU workers; pinned Sherpa/VAD stay real.
      # This job never builds a release; the signed-update workflow uses dist.
      TAURI_CONFIG: '{"build":{"frontendDist":"../scripts/ci-native-frontend"},"bundle":{"resources":{"resources/stt-base/fono-stt-vulkan-worker.exe":null}}}'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"
      - name: Verify fork-independent native CI contract
        shell: pwsh
        run: node --test scripts/ci-workflow.test.mjs
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - name: Bootstrap verified native runtime
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/bootstrap-ci-resources.ps1
      - name: Verify CUDA package and safe base staging
        shell: pwsh
        run: python scripts/cuda-package.test.py
      - name: Verify CPU contributor launcher on Windows
        shell: pwsh
        run: node --test scripts/dev-cpu.test.mjs
      - name: Cache pinned public CPU fixtures
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            build/remote-client-cpu/ggml-tiny.bin
            build/remote-client-cpu/jfk.wav
          key: remote-client-cpu-${{ runner.os }}-${{ hashFiles('apps/fono-server/tests/fixtures/remote-client-cpu.json') }}
      - name: Verify public CPU client-server fixtures
        shell: pwsh
        run: |
          node --test scripts/remote-client-cpu-resources.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/remote-client-cpu-resources.mjs --download --out-dir build/remote-client-cpu --github-env "$env:GITHUB_ENV"
          exit $LASTEXITCODE
      - name: Test and lint native workspace
        working-directory: .
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-native.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          exit $LASTEXITCODE
      - name: Recognize public audio through the real CPU server
        timeout-minutes: 5
        shell: pwsh
        env:
          FONO_TST02_REPORT: ${{ github.workspace }}/build/remote-client-cpu/windows.json
        run: ./scripts/test-native.ps1 -CargoArguments @('--locked', '-p', 'fono-server', '--lib') -TestArguments @('runtime::client_cpu::real_cpu_remote_client_roundtrip', '--ignored', '--exact', '--nocapture')
      - name: Verify resource pin and public feature combinations
        shell: pwsh
        run: |
          ./scripts/bootstrap-ci-resources.ps1 -ValidateOnly
          Push-Location $env:GITHUB_WORKSPACE
          try {
            $defaultTree = & cargo tree --locked -p fono --edges normal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($defaultTree -match '\bfono-wake v') {
              throw 'Default Fono must not include the disabled WakeWord crate.'
            }
            foreach ($features in @('', 'wake-word', 'sherpa-wake', 'experimental-live', 'experimental-live,sherpa-wake')) {
              $arguments = @('check', '--locked', '-p', 'fono', '--no-default-features')
              if ($features) { $arguments += @('--features', $features) }
              & cargo @arguments
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally { Pop-Location }
