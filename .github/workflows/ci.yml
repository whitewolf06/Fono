name: Fono checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fono-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core and protocol (no private packages)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - name: Format, core tests and clippy
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p fono-core -p fono-stt-protocol --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked -p fono-core -p fono-stt-protocol --all-targets -- -D warnings
          exit $LASTEXITCODE

  setup:
    name: Online installer (Windows)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - name: Build and verify standalone online installer
        shell: pwsh
        run: ./scripts/build-online-installer.ps1

  frontend:
    name: Frontend V3 and release scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"
          registry-url: https://registry.npmjs.org
      - name: Verify Linux optional dependency lock before installation
        run: node scripts/ci-frontend-dependencies.mjs --lock
      - name: Install locked dependencies
        run: |
          npm ci
      - name: Verify installed native frontend dependencies
        run: |
          node scripts/ci-frontend-dependencies.mjs --installed
          node --test scripts/ci-frontend-dependencies.test.mjs
      - name: Wake benchmark contracts without models or microphone
        run: python3 -m unittest discover -s tools/wake-bench -p test_bench.py -v
      - name: Wake training contracts without models or microphone
        run: python3 -m unittest discover -s tools/wake-training -p 'test_*.py' -v
      - name: Typecheck, lint, tests and formatting
        run: |
          npm run typecheck:v3
          npm run lint
          npm run test:v3
          npm run test:release
          npm run test:quality:stage5
          node --test scripts/long-dictation-quality.test.mjs
          npm run test:soak:contracts
          npm run test:cpu
          npm run docs:check
          npm run format:check
          npx prettier --check '.github/workflows/*.yml' 'scripts/*release*.mjs' scripts/update-manifest.mjs scripts/ci-native-dependencies.json src-tauri/update-channel.json tests/ui/diagnosticReport.test.mjs tests/ui/personalDictionary.test.mjs tests/ui/historyMetadata.test.mjs tests/ui/updates.test.mjs docs/fono-ci-updates.md docs/fono-quality-enhancements.md
          npm run version:check
          npm run build

  native:
    name: Windows native workspace (CPU)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      FONO_BUILD_REVISION: ${{ github.sha }}
      # Inert frontend fixture also supports explicit custom-protocol checks;
      # it needs no npm packages and does not exercise the real UI.
      # JSON Merge Patch removes only GPU workers; pinned Sherpa/VAD stay real.
      # This job never builds a release; the signed-update workflow uses dist.
      TAURI_CONFIG: '{"build":{"frontendDist":"../scripts/ci-native-frontend"},"bundle":{"resources":{"resources/stt-base/fono-stt-vulkan-worker.exe":null}}}'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"
      - name: Verify fork-independent native CI contract
        shell: pwsh
        run: node --test scripts/ci-workflow.test.mjs
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - name: Bootstrap verified native runtime
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/bootstrap-ci-resources.ps1
      - name: Verify CUDA package and safe base staging
        shell: pwsh
        run: python scripts/cuda-package.test.py
      - name: Verify CPU contributor launcher on Windows
        shell: pwsh
        run: node --test scripts/dev-cpu.test.mjs
      - name: Test and lint native workspace
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ../scripts/test-native.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          exit $LASTEXITCODE
      - name: Verify resource pin and public feature combinations
        shell: pwsh
        run: |
          ./scripts/bootstrap-ci-resources.ps1 -ValidateOnly
          Push-Location src-tauri
          try {
            $defaultTree = & cargo tree --locked -p fono --edges normal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($defaultTree -match '\bfono-wake v') {
              throw 'Default Fono must not include the disabled WakeWord crate.'
            }
            foreach ($features in @('', 'wake-word', 'sherpa-wake', 'experimental-live', 'experimental-live,sherpa-wake')) {
              $arguments = @('check', '--locked', '-p', 'fono', '--no-default-features')
              if ($features) { $arguments += @('--features', $features) }
              & cargo @arguments
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally { Pop-Location }
