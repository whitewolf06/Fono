name: Fono checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fono-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core and protocol (no private packages)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - name: Format, core tests and clippy
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p fono-core -p fono-stt-protocol --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked -p fono-core -p fono-stt-protocol --all-targets -- -D warnings
          exit $LASTEXITCODE

  frontend:
    name: Frontend V3 and release scripts
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"
          registry-url: https://npm.pkg.github.com
          scope: "@whitelife-core"
      - name: Install locked dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WHITEUI_NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Set WHITEUI_NPM_TOKEN with read:packages access to @whitelife-core/ui-kit."
            exit 1
          fi
          npm ci
      - name: Typecheck, lint, tests and formatting
        run: |
          npm run typecheck:v3
          npm run lint
          npm run test:ui
          npm run test:v3
          npm run test:release
          npm run format:check
          npx prettier --check '.github/workflows/*.yml' 'scripts/*release*.mjs' scripts/update-manifest.mjs scripts/ci-native-dependencies.json src-tauri/update-channel.json tests/ui/diagnosticReport.test.mjs tests/ui/personalDictionary.test.mjs tests/ui/historyMetadata.test.mjs tests/ui/updates.test.mjs docs/fono-ci-updates.md docs/fono-quality-enhancements.md
          npm run version:check
          npm run build

  native:
    name: Windows native workspace (CPU)
    needs: frontend
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      FONO_BUILD_REVISION: ${{ github.sha }}
      # Tauri uses JSON Merge Patch: null removes only this GPU resource glob.
      # CPU checks retain real pinned Sherpa/VAD resources; release keeps workers.
      TAURI_CONFIG: '{"bundle":{"resources":{"resources/stt-workers/*":null}}}'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"
          registry-url: https://npm.pkg.github.com
          scope: "@whitelife-core"
      - name: Build checked frontend on Windows without artifact storage
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WHITEUI_NPM_TOKEN }}
        shell: pwsh
        run: |
          if (!$env:NODE_AUTH_TOKEN) { throw 'Set WHITEUI_NPM_TOKEN with read:packages access.' }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - name: Bootstrap verified native runtime
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/bootstrap-ci-resources.ps1
      - name: Test and lint native workspace
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          exit $LASTEXITCODE
      - name: Verify resource pin and public feature combinations
        shell: pwsh
        run: |
          ./scripts/bootstrap-ci-resources.ps1 -ValidateOnly
          Push-Location src-tauri
          try {
            cargo check --locked -p fono --no-default-features
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo check --locked -p fono --no-default-features --features whisper-wake
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo check --locked -p fono --no-default-features --features sherpa-wake
            exit $LASTEXITCODE
          } finally { Pop-Location }
