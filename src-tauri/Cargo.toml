[package]
license = "MIT"
name = "fono"
version = "0.8.22"
description = "Голосовой ввод и голосовое управление компьютером для Windows"
authors = ["Fono"]
edition = "2021"
rust-version = "1.75"
publish = false

# Общая библиотека приложения для desktop entrypoint и native-проверок.
[lib]
name = "fono_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }

sha2 = { workspace = true }

[dependencies]
# Tauri core
# with_webview exposes version-specific WebView2 controller types.
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-single-instance = "=2.4.3"

# Wake word subsystem
fono-types = { workspace = true }
fono-stt = { workspace = true }
fono-service = { workspace = true }
fono-wake = { workspace = true, optional = true, default-features = false }
fono-stt-protocol = { workspace = true, features = ["inference"] }
fono-core = { workspace = true }
fono-audio = { workspace = true, default-features = false }
sherpa-onnx = { workspace = true, optional = true, default-features = false, features = ["shared"] }

# Сериализация
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
minisign-verify = "=0.2.5"

# Асинхронность / ошибки
regex = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Логи
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Аудио (захват через WASAPI на Windows)
cpal = { workspace = true }

# Встроенный Whisper STT; GPU workers собираются отдельно.
whisper-rs = { workspace = true }
symphonia = { version = "0.5.5", default-features = false, features = ["wav", "mp3", "flac", "ogg", "vorbis", "pcm"] }
audiopus = "0.2"
axum = { workspace = true, features = ["multipart"] }
tower = { workspace = true, features = ["util"] }

# Общие сетевые, конкурентные и файловые зависимости
reqwest = { workspace = true, features = ["json", "stream", "blocking"] }
parking_lot = { workspace = true }
crossbeam-queue = { workspace = true }
crossbeam-channel = { workspace = true }
once_cell = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tar = { workspace = true }
bzip2 = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

# Win32 API: SendInput для текст-инъекции
[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = "=2.12.0"
webview2-com = "=0.38.2"
arboard = "3.4"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Media_Audio",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security_Credentials",
    "Win32_Security_Authorization",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_UI_Accessibility",
    "Win32_Storage_FileSystem",
] }

[features]
# Tauri CLI enables embedded assets for build; dev must use its live devUrl.
custom-protocol = ["tauri/custom-protocol"]
# Portable CPU build is the release default. GPU builds are explicit opt-in so
# a normal installer does not require CUDA/CUBLAS on the target machine.
default = ["speech-vad", "offline-stt"]
speech-vad = ["fono-audio/speech-vad", "fono-stt/speech-vad"]
offline-stt = ["dep:sherpa-onnx", "speech-vad", "fono-stt/offline-stt"]
# Contributor profile: real speech VAD and embedded CPU Whisper, with no GPU workers.
cpu-only = ["speech-vad", "offline-stt", "fono-stt/cpu-only"]
wake-word = ["dep:fono-wake"]
experimental-live = []
# Встроенное GPU-ускорение через CUDA для явной сборки с CUDA Toolkit.
cuda = ["whisper-rs/cuda", "fono-stt/cuda"]
# Встроенное GPU-ускорение через Vulkan для явной сборки с Vulkan SDK.
vulkan = ["whisper-rs/vulkan", "fono-stt/vulkan"]
# Wake word backends
sherpa-wake = ["wake-word", "speech-vad", "fono-wake/sherpa-wake"]

[dev-dependencies]
fono-stt = { workspace = true, features = ["test-support"] }
