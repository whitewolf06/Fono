[workspace]
members = [".", "crates/fono-wake"]
resolver = "2"

[package]
name = "fono"
version = "0.1.0"
description = "Голосовой ввод и голосовое управление компьютером для Windows"
authors = ["Fono"]
edition = "2021"
rust-version = "1.75"

# На Windows прячем консольное окно для release-сборки
[lib]
name = "fono_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-opener = "2.0"

# Wake word subsystem
fono-wake = { path = "crates/fono-wake" }

# Сериализация
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Асинхронность / ошибки
tokio = { version = "1.41", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"

# Логи
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Аудио (захват через WASAPI на Windows)
cpal = "0.15"

# Whisper STT — автоматически собирает whisper.cpp через build-script
# Включаем feature для core (CPU); cuda добавим позже на этапе оптимизации
whisper-rs = "0.16"

# Win32 API: SendInput для текст-инъекции
[target.'cfg(windows)'.dependencies]
arboard = "3.4"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

# HTTP-клиент к LM Studio
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }

# Конcurrency
parking_lot = "0.12"
crossbeam-queue = "0.3"
crossbeam-channel = "0.5"

# Утилиты
once_cell = "1.20"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
tar = "0.4"
bzip2 = "0.4"

[features]
# По умолчанию используем CUDA для whisper (если доступно).
# В runtime GPU можно отключить в настройках (use_gpu=false).
default = ["cuda", "whisper-wake", "sherpa-wake"]
# GPU-ускорение через CUDA (нужен CUDA Toolkit 12.8+, ~3 ГБ установка)
cuda = ["whisper-rs/cuda"]
# GPU-ускорение через Vulkan (нужен Vulkan SDK ~500 МБ, работает на любой GPU)
vulkan = ["whisper-rs/vulkan"]
# Wake word backends
whisper-wake = ["fono-wake/whisper-wake"]
sherpa-wake = ["fono-wake/sherpa-wake"]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
# opt-level = 3 (не "s"!) — whisper критична скорость, не размер.
# "s" оптимизирует по размеру и убивает SIMD-распараллеливание.
opt-level = 3
panic = "abort"
strip = true

# Нативные инструкции CPU (AVX2/AVX512/FMA) — критично для whisper.cpp.
# ggml активно использует SIMD; без этого whisper работает в 3-5x медленнее.
[profile.release.package.whisper-rs-sys]
opt-level = 3
strip = true
