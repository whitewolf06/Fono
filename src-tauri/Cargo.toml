[package]
name = "whisperclone"
version = "0.1.0"
description = "Голосовой ввод для Windows — локальный аналог Wispr Flow"
authors = ["WhisperClone"]
edition = "2021"
rust-version = "1.75"

# На Windows прячем консольное окно для release-сборки
[lib]
name = "whisperclone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-opener = "2.0"

# Сериализация
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Асинхронность / ошибки
tokio = { version = "1.41", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"

# Логи
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Аудио (захват через WASAPI на Windows)
cpal = "0.15"

# Whisper STT — автоматически собирает whisper.cpp через build-script
# Включаем feature для core (CPU); cuda добавим позже на этапе оптимизации
whisper-rs = "0.16"

# Win32 API: SendInput для текст-инъекции
[target.'cfg(windows)'.dependencies]
arboard = "3.4"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# HTTP-клиент к LM Studio
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }

# Конcurrency
parking_lot = "0.12"
crossbeam-queue = "0.3"
crossbeam-channel = "0.5"

# Утилиты
once_cell = "1.20"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

[features]
# По умолчанию используем CPU-only whisper
default = []
# GPU-ускорение через CUDA (нужен CUDA Toolkit 12.8+, ~3 ГБ установка)
cuda = ["whisper-rs/cuda"]
# GPU-ускорение через Vulkan (нужен Vulkan SDK ~500 МБ, работает на любой GPU)
vulkan = ["whisper-rs/vulkan"]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
