# Portable release configuration. Do not force target-cpu=native or AVX2 here:
# a distributable binary must run on another Windows machine, not only on the
# CPU that built it. Native/CUDA benchmarking belongs in an explicit local build.
[env]
CMAKE_C_FLAGS_RELEASE = "/O2 /Ob2 /DNDEBUG"
CMAKE_CXX_FLAGS_RELEASE = "/O2 /Ob2 /DNDEBUG"
