# Нативные инструкции CPU (AVX2/AVX512/FMA/BMI2).
# Критично для whisper.cpp — без этого ggml работает в 3-5x медленнее,
# потому что не использует SIMD-инструкции вашего процессора.
# i5-12600KF поддерживает AVX2 + FMA — даёт ~3x ускорение на whisper.
[build]
rustflags = ["-C", "target-cpu=native"]
