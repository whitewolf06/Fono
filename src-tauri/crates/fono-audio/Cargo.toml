[package]
name = "fono-audio"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Shared audio capture and speech VAD for Fono"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
cpal = "0.15"
sherpa-onnx = { version = "1.13", optional = true, default-features = false, features = ["shared"] }

[features]
default = ["speech-vad"]
speech-vad = ["dep:sherpa-onnx"]
