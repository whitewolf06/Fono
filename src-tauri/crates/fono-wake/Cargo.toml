[package]
license = "MIT"
name = "fono-wake"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Wake word subsystem for Fono"
publish = false

[dependencies]
fono-audio = { version = "0.1.0", path = "../fono-audio", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
cpal = "0.15"

# Sherpa-ONNX backend
sherpa-onnx = { version = "1.13", optional = true, default-features = false, features = ["shared"] }

[features]
default = []
sherpa-wake = ["dep:sherpa-onnx", "fono-audio/speech-vad"]

[[example]]
name = "wake_bench"
required-features = ["sherpa-wake"]

[[example]]
name = "kws_probe"
required-features = ["sherpa-wake"]
