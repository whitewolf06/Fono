# Keep Windows release optimization in the CMake project, so Linux never
# receives MSVC flags. Native CPU/CUDA tuning belongs in an explicit local build.
[env]
CMAKE_PROJECT_INCLUDE = { value = "src-tauri/cmake/whisper-msvc-release.cmake", relative = true }
[build]
# Preserve desktop resource, packaging and cache locations after moving the workspace.
target-dir = "src-tauri/target"
