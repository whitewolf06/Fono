<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1f23"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97066"/>
      <stop offset="100%" stop-color="#d92d20"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- Микрофон -->
  <g transform="translate(512 512)">
    <!-- Капсула микрофона -->
    <rect x="-90" y="-220" width="180" height="320" rx="90" fill="url(#mic)"/>
    <!-- Подставка (дуга) -->
    <path d="M -210 -20 a 210 210 0 0 0 420 0" stroke="#f97066" stroke-width="36" fill="none" stroke-linecap="round"/>
    <!-- Ножка -->
    <rect x="-18" y="200" width="36" height="80" fill="#f97066"/>
    <!-- База -->
    <rect x="-110" y="280" width="220" height="28" rx="14" fill="#f97066"/>
  </g>
</svg>
