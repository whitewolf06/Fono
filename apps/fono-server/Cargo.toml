[package]
name = "fono-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
fono-service = { workspace = true }
fono-core = { workspace = true }
fono-stt = { workspace = true, features = ["speech-vad", "offline-stt"] }
fono-audio = { workspace = true }
fono-types = { workspace = true }
fono-stt-protocol = { workspace = true }
clap = { version = "=4.6.1", default-features = false, features = ["std", "help", "usage"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "io-util"] }
tracing = { workspace = true }
toml = "0.9"
sha2 = { workspace = true }
subtle = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
hyper-util = { workspace = true, features = ["server-auto", "http1", "http2", "service", "tokio"] }
rustls = { workspace = true, features = ["std", "ring", "tls12"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
openssl = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }
futures-util = { workspace = true }

[features]
default = ["vulkan-worker"]
cpu-only = ["fono-stt/cpu-only"]
# Process-isolated CUDA: the server itself does not link the CUDA toolkit.
cuda-worker = []
# Process-isolated Vulkan; the server does not link a graphics driver.
vulkan-worker = []
