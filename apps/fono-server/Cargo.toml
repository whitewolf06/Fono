[package]
name = "fono-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
fono-service = { workspace = true }
fono-core = { workspace = true }
fono-stt = { workspace = true, features = ["cpu-only"] }
fono-audio = { workspace = true }
fono-types = { workspace = true }
fono-stt-protocol = { workspace = true }
clap = { version = "=4.6.1", default-features = false, features = ["std", "help", "usage"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tracing = { workspace = true }
toml = "0.9"
sha2 = { workspace = true }
subtle = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }
