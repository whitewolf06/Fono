[package]
name = "fono-stt"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Shared speech recognition engine and model services for Fono"

[dependencies]
fono-types = { workspace = true }
fono-core = { workspace = true }
fono-audio = { workspace = true }
fono-stt-protocol = { workspace = true, features = ["inference"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
crossbeam-channel = { workspace = true }
once_cell = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
reqwest = { workspace = true, features = ["blocking"] }
whisper-rs = { workspace = true }
sherpa-onnx = { workspace = true, optional = true }
anyhow = { workspace = true }

[dev-dependencies]
symphonia = { version = "0.5.5", default-features = false, features = ["wav", "mp3", "flac", "ogg", "vorbis", "pcm"] }
audiopus = "0.2"

[features]
default = ["speech-vad", "offline-stt"]
speech-vad = ["fono-audio/speech-vad"]
offline-stt = ["dep:sherpa-onnx", "speech-vad"]
cpu-only = ["speech-vad", "offline-stt"]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
test-support = []
