[package]
name = "fono-service"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
fono-core = { workspace = true }
fono-types = { workspace = true }
fono-stt = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
symphonia = { version = "0.5.5", default-features = false, features = ["wav", "mp3", "flac", "ogg", "vorbis", "pcm"] }
audiopus = "0.2"

[dev-dependencies]
serde_json = { workspace = true }
tower = { workspace = true, features = ["util"] }
reqwest = { workspace = true, features = ["json"] }
futures-util = { workspace = true }
