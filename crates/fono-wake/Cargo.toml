[package]
license = "MIT"
name = "fono-wake"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Wake word subsystem for Fono"
publish = false

[dependencies]
fono-audio = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
cpal = { workspace = true }

# Sherpa-ONNX backend
sherpa-onnx = { workspace = true, optional = true, default-features = false, features = ["shared"] }

[features]
default = []
sherpa-wake = ["dep:sherpa-onnx", "fono-audio/speech-vad"]

[[example]]
name = "wake_bench"
required-features = ["sherpa-wake"]

[[example]]
name = "kws_probe"
required-features = ["sherpa-wake"]
